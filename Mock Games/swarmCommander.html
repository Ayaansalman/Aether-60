<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Swarm Commander</title>
    <style>
        :root {
            --cmd-green: #00ff66;
            --swarm-teal: #00f2ff;
            --enemy-red: #ff3344;
            --bg-deep: #05080a;
            --ui-gold: #ffcc00;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-deep);
            font-family: 'Courier New', Courier, monospace;
            color: white;
            user-select: none;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            background: radial-gradient(circle at center, #0a151a 0%, #05080a 100%);
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .hud-box {
            background: rgba(0, 20, 30, 0.8);
            border: 1px solid var(--swarm-teal);
            padding: 10px 15px;
            box-shadow: inset 0 0 10px rgba(0, 242, 255, 0.2);
        }

        .label {
            font-size: 0.7rem;
            color: var(--swarm-teal);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .value {
            font-size: 1.2rem;
            font-weight: bold;
            text-shadow: 0 0 5px var(--swarm-teal);
        }

        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            pointer-events: auto;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: var(--cmd-green);
            font-size: 3rem;
            margin: 0;
            letter-spacing: 10px;
            text-shadow: 0 0 20px var(--cmd-green);
        }

        .btn {
            background: transparent;
            border: 1px solid var(--cmd-green);
            color: var(--cmd-green);
            padding: 15px 50px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 30px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .btn:hover {
            background: var(--cmd-green);
            color: black;
            box-shadow: 0 0 30px var(--cmd-green);
        }

        #message-box {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--ui-gold);
            font-size: 1rem;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #joystick-container {
            position: absolute;
            bottom: 50px;
            left: 50px;
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: none;
            border: 1px solid var(--swarm-teal);
        }

        #joystick-knob {
            position: absolute;
            width: 40px;
            height: 40px;
            background: var(--swarm-teal);
            border-radius: 50%;
            top: 30px;
            left: 30px;
        }
    </style>
</head>

<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer">
            <div class="stats-row">
                <div class="hud-box">
                    <div class="label">Swarm Integrity</div>
                    <div id="swarm-size" class="value">10 Units</div>
                </div>
                <div class="hud-box">
                    <div class="label">Eliminations</div>
                    <div id="kills" class="value">0000</div>
                </div>
            </div>

            <div id="message-box">COMMANDER ACQUIRED</div>

            <div class="stats-row">
                <div class="hud-box" style="border-color: var(--ui-gold);">
                    <div class="label" style="color: var(--ui-gold);">Command Level</div>
                    <div id="level-val" class="value" style="color: var(--ui-gold);">01</div>
                </div>
            </div>
        </div>

        <div id="overlay">
            <h1 id="title">SWARM COMMANDER</h1>
            <p style="color: #888; max-width: 400px; line-height: 1.6; margin-top: 20px;">
                YOU ARE THE HIVE. <br>
                Collect recruits to grow your tail. <br>
                Encircle enemies to destroy them. <br>
                Do not let the head be struck.
            </p>
            <div id="final-stats" style="display:none; margin: 20px 0;">
                <div id="res-kills"></div>
                <div id="res-swarm"></div>
            </div>
            <button class="btn" id="start-btn">Initialize Hive</button>
            <p style="font-size: 0.8rem; color: #555; margin-top: 20px;">WASD/ARROWS to Command • MOUSE/TOUCH to Steer
            </p>
        </div>

        <div id="joystick-container">
            <div id="joystick-knob"></div>
        </div>
    </div>

    <script>
        /** @type {HTMLCanvasElement} */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-btn');
        const msgBox = document.getElementById('message-box');

        // UI Elements
        const swarmSizeEl = document.getElementById('swarm-size');
        const killsEl = document.getElementById('kills');
        const levelEl = document.getElementById('level-val');

        // Configuration
        const BASE_SPEED = 4;
        const TURN_SPEED = 0.08;
        const FOLLOWER_DELAY = 6; // Frames between segments
        const INITIAL_FOLLOWERS = 5;
        const ENEMY_SPAWN_RATE = 120; // Frames

        // Game State
        let state = {
            active: false,
            score: 0,
            level: 1,
            kills: 0,
            frameCount: 0,
            keys: {},
            mouse: { x: 0, y: 0, down: false },
            lastPos: [] // Position history for snake logic
        };

        let swarm = [];
        let enemies = [];
        let pickups = [];
        let particles = [];

        class Unit {
            constructor(x, y, isLeader = false) {
                this.x = x;
                this.y = y;
                this.angle = 0;
                this.isLeader = isLeader;
                this.radius = isLeader ? 10 : 6;
                this.pulse = 0;
            }

            update() {
                this.pulse += 0.1;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                const glow = 5 + Math.sin(this.pulse) * 3;
                ctx.shadowBlur = glow;
                ctx.shadowColor = this.isLeader ? '#00ff66' : '#00f2ff';

                if (this.isLeader) {
                    // Command Unit
                    ctx.fillStyle = '#00ff66';
                    ctx.beginPath();
                    ctx.moveTo(12, 0);
                    ctx.lineTo(-8, -8);
                    ctx.lineTo(-4, 0);
                    ctx.lineTo(-8, 8);
                    ctx.closePath();
                    ctx.fill();
                } else {
                    // Swarm Unit
                    ctx.fillStyle = '#00f2ff';
                    ctx.globalAlpha = 0.8;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fill();

                    // Tech detail
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(-2, -2);
                    ctx.lineTo(2, 2);
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        class Enemy {
            constructor(x, y, type = 'basic') {
                this.x = x;
                this.y = y;
                this.hp = type === 'tank' ? 100 : 30;
                this.maxHp = this.hp;
                this.radius = type === 'tank' ? 20 : 12;
                this.type = type;
                this.color = '#ff3344';
                this.angle = Math.random() * Math.PI * 2;
            }

            update() {
                // Slight drift towards player
                const dx = swarm[0].x - this.x;
                const dy = swarm[0].y - this.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                this.x += (dx / dist) * 0.5;
                this.y += (dy / dist) * 0.5;
                this.angle += 0.02;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Outer Shield
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.strokeRect(-this.radius, -this.radius, this.radius * 2, this.radius * 2);

                // Core
                const hpPct = this.hp / this.maxHp;
                ctx.fillStyle = this.color;
                ctx.globalAlpha = 0.3 + (hpPct * 0.7);
                ctx.fillRect(-this.radius + 4, -this.radius + 4, (this.radius * 2 - 8) * hpPct, (this.radius * 2 - 8));

                ctx.restore();
            }
        }

        class Pickup {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 5;
                this.life = 600;
            }
            draw() {
                ctx.fillStyle = '#ffcc00';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ffcc00';
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4 + Math.sin(state.frameCount * 0.1) * 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function init() {
            resize();
            window.addEventListener('resize', resize);
            window.addEventListener('keydown', e => state.keys[e.code] = true);
            window.addEventListener('keyup', e => state.keys[e.code] = false);
            window.addEventListener('mousemove', e => {
                state.mouse.x = e.clientX;
                state.mouse.y = e.clientY;
            });
            window.addEventListener('mousedown', () => state.mouse.down = true);
            window.addEventListener('mouseup', () => state.mouse.down = false);

            // Touch
            canvas.addEventListener('touchstart', e => {
                state.mouse.down = true;
                state.mouse.x = e.touches[0].clientX;
                state.mouse.y = e.touches[0].clientY;
            }, { passive: false });
            canvas.addEventListener('touchmove', e => {
                state.mouse.x = e.touches[0].clientX;
                state.mouse.y = e.touches[0].clientY;
            }, { passive: false });
            canvas.addEventListener('touchend', () => state.mouse.down = false);

            startBtn.addEventListener('click', startGame);

            requestAnimationFrame(gameLoop);
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function startGame() {
            state.active = true;
            state.score = 0;
            state.kills = 0;
            state.level = 1;
            state.frameCount = 0;
            state.lastPos = [];
            swarm = [new Unit(canvas.width / 2, canvas.height / 2, true)];
            for (let i = 0; i < INITIAL_FOLLOWERS; i++) addFollower();
            enemies = [];
            pickups = [];
            particles = [];
            overlay.style.display = 'none';
            showMessage("HIVE INITIALIZED");
        }

        function addFollower() {
            swarm.push(new Unit(-100, -100));
            updateUI();
        }

        function showMessage(txt) {
            msgBox.innerText = txt;
            msgBox.style.opacity = 1;
            setTimeout(() => msgBox.style.opacity = 0, 2000);
        }

        function updateUI() {
            swarmSizeEl.innerText = `${swarm.length} Units`;
            killsEl.innerText = state.kills.toString().padStart(4, '0');
            levelEl.innerText = state.level.toString().padStart(2, '0');
        }

        function createExplosion(x, y, color, count = 10) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 1.0,
                    color: color,
                    size: Math.random() * 3 + 1
                });
            }
        }

        function update() {
            if (!state.active) return;
            state.frameCount++;

            const leader = swarm[0];

            // 1. Leader Movement
            let targetAngle = leader.angle;
            if (state.keys['KeyA'] || state.keys['ArrowLeft']) targetAngle -= TURN_SPEED;
            if (state.keys['KeyD'] || state.keys['ArrowRight']) targetAngle += TURN_SPEED;

            // Mouse/Touch steering override
            if (state.mouse.down) {
                const dx = state.mouse.x - leader.x;
                const dy = state.mouse.y - leader.y;
                const mouseAngle = Math.atan2(dy, dx);
                const diff = mouseAngle - leader.angle;
                // Normalize angle diff
                const wrappedDiff = Math.atan2(Math.sin(diff), Math.cos(diff));
                targetAngle += wrappedDiff * 0.1;
            }

            leader.angle = targetAngle;
            leader.x += Math.cos(leader.angle) * BASE_SPEED;
            leader.y += Math.sin(leader.angle) * BASE_SPEED;

            // Screen wrap or bounce? Let's do soft bounce
            if (leader.x < 0 || leader.x > canvas.width) leader.angle = Math.PI - leader.angle;
            if (leader.y < 0 || leader.y > canvas.height) leader.angle = -leader.angle;

            // 2. Snake Logic (Position History)
            state.lastPos.unshift({ x: leader.x, y: leader.y, angle: leader.angle });
            if (state.lastPos.length > swarm.length * FOLLOWER_DELAY + 10) {
                state.lastPos.pop();
            }

            // Update Followers
            for (let i = 1; i < swarm.length; i++) {
                const index = i * FOLLOWER_DELAY;
                if (state.lastPos[index]) {
                    swarm[i].x = state.lastPos[index].x;
                    swarm[i].y = state.lastPos[index].y;
                    swarm[i].angle = state.lastPos[index].angle;
                }
                swarm[i].update();
            }
            leader.update();

            // 3. Spawning
            if (state.frameCount % ENEMY_SPAWN_RATE === 0) {
                const side = Math.floor(Math.random() * 4);
                let ex, ey;
                if (side === 0) { ex = Math.random() * canvas.width; ey = -50; }
                else if (side === 1) { ex = canvas.width + 50; ey = Math.random() * canvas.height; }
                else if (side === 2) { ex = Math.random() * canvas.width; ey = canvas.height + 50; }
                else { ex = -50; ey = Math.random() * canvas.height; }
                enemies.push(new Enemy(ex, ey, Math.random() > 0.9 ? 'tank' : 'basic'));
            }

            // 4. Combat Logic
            enemies.forEach((enemy, eIdx) => {
                enemy.update();

                // Check if leader hit (Game Over)
                const dLeader = Math.hypot(leader.x - enemy.x, leader.y - enemy.y);
                if (dLeader < leader.radius + enemy.radius) {
                    gameOver();
                }

                // Damage logic: Swarm units deal damage when nearby
                // This simulates "encircling" or "swarming"
                let damageTaken = 0;
                swarm.forEach(unit => {
                    const dist = Math.hypot(unit.x - enemy.x, unit.y - enemy.y);
                    if (dist < 60) {
                        damageTaken += 0.5;
                        // Draw visual connection for "swarming" feel later in draw()
                    }
                });

                enemy.hp -= damageTaken;
                if (enemy.hp <= 0) {
                    createExplosion(enemy.x, enemy.y, '#ff3344', 15);
                    state.kills++;
                    state.score += 100;
                    if (Math.random() > 0.5) pickups.push(new Pickup(enemy.x, enemy.y));
                    enemies.splice(eIdx, 1);
                    updateUI();

                    if (state.kills % 10 === 0) {
                        state.level++;
                        showMessage(`LEVEL ${state.level} - SWARM CAPACITY INCREASED`);
                        updateUI();
                    }
                }
            });

            // 5. Pickups
            pickups.forEach((p, pIdx) => {
                const dist = Math.hypot(leader.x - p.x, leader.y - p.y);
                if (dist < 30) {
                    addFollower();
                    createExplosion(p.x, p.y, '#ffcc00', 5);
                    pickups.splice(pIdx, 1);
                }
                p.life--;
                if (p.life <= 0) pickups.splice(pIdx, 1);
            });

            // 6. Particles
            particles.forEach((p, idx) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                if (p.life <= 0) particles.splice(idx, 1);
            });
        }

        function gameOver() {
            state.active = false;
            createExplosion(swarm[0].x, swarm[0].y, '#00ff66', 40);

            document.getElementById('title').innerText = "HIVE COLLAPSED";
            document.getElementById('final-stats').style.display = 'block';
            document.getElementById('res-kills').innerText = `Eliminations: ${state.kills}`;
            document.getElementById('res-swarm').innerText = `Peak Swarm Size: ${swarm.length}`;
            document.getElementById('start-btn').innerText = "Re-Initialize";
            overlay.style.display = 'flex';
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Grid Background
            ctx.strokeStyle = 'rgba(0, 242, 255, 0.05)';
            ctx.lineWidth = 1;
            const gridSize = 50;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Swarm Trails (Links)
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(0, 242, 255, 0.2)';
            ctx.lineWidth = 2;
            swarm.forEach((unit, i) => {
                if (i === 0) ctx.moveTo(unit.x, unit.y);
                else ctx.lineTo(unit.x, unit.y);
            });
            ctx.stroke();

            // Pickups
            pickups.forEach(p => p.draw());

            // Enemies and Swarm Links
            enemies.forEach(enemy => {
                // Visual "Swarm Siphon" effect
                swarm.forEach(unit => {
                    const dist = Math.hypot(unit.x - enemy.x, unit.y - enemy.y);
                    if (dist < 70) {
                        ctx.beginPath();
                        ctx.strokeStyle = 'rgba(0, 242, 255, 0.3)';
                        ctx.setLineDash([2, 5]);
                        ctx.moveTo(unit.x, unit.y);
                        ctx.lineTo(enemy.x, enemy.y);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                });
                enemy.draw();
            });

            // Swarm Units
            swarm.forEach(unit => unit.draw());

            // Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            // Vignette
            const grd = ctx.createRadialGradient(canvas.width / 2, canvas.height / 2, 0, canvas.width / 2, canvas.height / 2, canvas.width);
            grd.addColorStop(0, 'rgba(0,0,0,0)');
            grd.addColorStop(1, 'rgba(0,0,0,0.4)');
            ctx.fillStyle = grd;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        init();
    </script>
</body>

</html>
