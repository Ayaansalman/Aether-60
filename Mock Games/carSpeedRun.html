<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Courier</title>
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff00ea;
            --neon-yellow: #f4ff00;
            --bg-dark: #0a0a12;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: white;
            user-select: none;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .hud-item {
            background: rgba(0, 0, 0, 0.6);
            border-left: 4px solid var(--neon-blue);
            padding: 10px 20px;
            margin-bottom: 10px;
            width: fit-content;
            backdrop-filter: blur(5px);
        }

        #freshness-container {
            width: 200px;
            height: 10px;
            background: #333;
            margin-top: 5px;
            border-radius: 5px;
            overflow: hidden;
        }

        #freshness-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, var(--neon-yellow), var(--neon-pink));
            transition: width 0.1s linear;
        }

        #screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            pointer-events: auto;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            color: var(--neon-blue);
            text-shadow: 0 0 15px var(--neon-blue);
            margin-bottom: 10px;
            letter-spacing: 5px;
        }

        .btn {
            background: transparent;
            border: 2px solid var(--neon-pink);
            color: var(--neon-pink);
            padding: 15px 40px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 20px;
        }

        .btn:hover {
            background: var(--neon-pink);
            color: white;
            box-shadow: 0 0 20px var(--neon-pink);
        }

        .controls-hint {
            margin-top: 30px;
            color: #888;
            font-size: 0.9rem;
        }

        #mobile-controls {
            display: none;
            position: absolute;
            bottom: 30px;
            width: 100%;
            justify-content: space-around;
            pointer-events: auto;
        }

        .touch-btn {
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--neon-blue);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            #mobile-controls {
                display: flex;
            }

            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer">
            <div class="hud-item">
                <div style="font-size: 0.8rem; color: var(--neon-blue);">CREDITS</div>
                <div id="score-val" style="font-size: 1.5rem; font-weight: bold;">0</div>
            </div>
            <div class="hud-item" id="delivery-hud" style="display: none;">
                <div style="font-size: 0.8rem; color: var(--neon-yellow);">PACKAGE FRESHNESS</div>
                <div id="freshness-container">
                    <div id="freshness-bar"></div>
                </div>
                <div id="distance-val" style="font-size: 0.7rem; margin-top: 5px; color: #ccc;">Distance: 400m</div>
            </div>
            <div class="hud-item">
                <div style="font-size: 0.8rem; color: var(--neon-pink);">SPEED</div>
                <div id="speed-val" style="font-size: 1.2rem; font-weight: bold;">0 KM/H</div>
            </div>
        </div>

        <div id="screen-overlay">
            <h1 id="main-title">NEON COURIER</h1>
            <p id="sub-title">Deliver fast. Avoid the gridlock. Stay fresh.</p>
            <div id="final-stats" style="display: none; margin: 20px 0;">
                <div id="final-score"></div>
                <div id="final-deliveries"></div>
            </div>
            <button class="btn" id="start-btn">Start Transmission</button>
            <div class="controls-hint" id="hint-text">WASD / ARROWS to Move • SPACE to Brake</div>
        </div>

        <div id="mobile-controls">
            <div class="touch-btn" id="touch-left">L</div>
            <div class="touch-btn" id="touch-up">ACCEL</div>
            <div class="touch-btn" id="touch-right">R</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const screenOverlay = document.getElementById('screen-overlay');
        const freshnessBar = document.getElementById('freshness-bar');
        const deliveryHud = document.getElementById('delivery-hud');
        const scoreVal = document.getElementById('score-val');
        const speedVal = document.getElementById('speed-val');
        const distanceVal = document.getElementById('distance-val');

        // Game Constants
        const LANE_WIDTH = 80;
        const ROAD_WIDTH = 400;
        const PLAYER_ACCEL = 0.4;
        const PLAYER_FRICTION = 0.96;
        const PLAYER_MAX_SPEED = 12;
        const OBSTACLE_BASE_SPEED = 3;
        const FRESHNESS_DECAY_RATE = 0.15;

        // Game State
        let gameActive = false;
        let score = 0;
        let totalDeliveries = 0;
        let worldY = 0;
        let speed = 0;
        let frameCount = 0; // For animations
        let keys = {};
        let particles = [];
        let obstacles = [];
        let currentPackage = null;
        let deliveryPoint = null;
        let buildings = [];

        // Player Object
        const player = {
            x: 0,
            y: 0,
            width: 30,
            height: 50,
            lane: 2,
            targetX: 0,
            rotation: 0,
            color: '#00f2ff',
            hoverOffset: 0 // Procedural animation variable
        };

        function init() {
            resize();
            player.x = canvas.width / 2;
            player.targetX = player.x;
            player.y = canvas.height * 0.85;

            buildings = [];
            for (let i = 0; i < 10; i++) {
                spawnBuilding(i * -200);
            }

            requestAnimationFrame(gameLoop);
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.x = canvas.width / 2;
            player.targetX = player.x;
            player.y = canvas.height * 0.85;
        }

        window.addEventListener('resize', resize);
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // Touch Handling
        const touchBtns = {
            'touch-left': 'ArrowLeft',
            'touch-right': 'ArrowRight',
            'touch-up': 'ArrowUp'
        };

        Object.keys(touchBtns).forEach(id => {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[touchBtns[id]] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[touchBtns[id]] = false; });
        });

        startBtn.addEventListener('click', () => {
            resetGame();
            gameActive = true;
            screenOverlay.style.display = 'none';
        });

        function resetGame() {
            score = 0;
            totalDeliveries = 0;
            speed = 0;
            obstacles = [];
            particles = [];
            currentPackage = null;
            deliveryPoint = null;
            worldY = 0;
            spawnPackage();
            scoreVal.innerText = '0';
        }

        function spawnBuilding(y) {
            const side = Math.random() > 0.5 ? 1 : -1;
            const width = 100 + Math.random() * 100;
            const x = side === 1 ? (canvas.width / 2 + ROAD_WIDTH / 2 + 20) : (canvas.width / 2 - ROAD_WIDTH / 2 - 20 - width);
            buildings.push({
                x, y, width,
                height: 150 + Math.random() * 200,
                color: `hsl(${200 + Math.random() * 60}, 50%, 20%)`,
                neonColor: Math.random() > 0.5 ? 'var(--neon-blue)' : 'var(--neon-pink)',
                flicker: Math.random() // Unique flicker phase
            });
        }

        function spawnObstacle() {
            const lane = Math.floor(Math.random() * 4);
            const x = (canvas.width / 2 - ROAD_WIDTH / 2) + (lane * LANE_WIDTH) + LANE_WIDTH / 2;
            obstacles.push({
                x,
                y: -100,
                width: 35,
                height: 60,
                speed: OBSTACLE_BASE_SPEED + Math.random() * 2,
                type: 'car',
                color: Math.random() > 0.5 ? '#ff0055' : '#7700ff'
            });
        }

        function spawnPackage() {
            currentPackage = {
                freshness: 100,
                distance: 1000 + Math.random() * 2000,
                targetDist: 0
            };
            currentPackage.targetDist = currentPackage.distance;
            deliveryHud.style.display = 'block';
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 20; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 1,
                    color: color
                });
            }
        }

        function update() {
            frameCount++;
            if (!gameActive) return;

            // Physics
            if (keys['ArrowUp'] || keys['KeyW']) speed += PLAYER_ACCEL;
            if (keys['ArrowDown'] || keys['KeyS'] || keys['Space']) speed *= 0.92;

            speed *= PLAYER_FRICTION;
            if (speed > PLAYER_MAX_SPEED) speed = PLAYER_MAX_SPEED;
            if (speed < 0.1) speed = 0;

            speedVal.innerText = `${Math.floor(speed * 20)} KM/H`;

            // Hover animation logic
            player.hoverOffset = Math.sin(frameCount * 0.1) * 3;

            // Steering
            let steer = 0;
            if (keys['ArrowLeft'] || keys['KeyA']) steer = -5;
            if (keys['ArrowRight'] || keys['KeyD']) steer = 5;

            player.x += steer * (speed / 10 + 0.5);
            player.rotation = steer * 0.05;

            // Bound check
            const roadLeft = canvas.width / 2 - ROAD_WIDTH / 2;
            const roadRight = canvas.width / 2 + ROAD_WIDTH / 2;
            if (player.x < roadLeft + 20) player.x = roadLeft + 20;
            if (player.x > roadRight - 20) player.x = roadRight - 20;

            // Move world
            worldY += speed;

            // Update package
            if (currentPackage) {
                currentPackage.distance -= speed;
                currentPackage.freshness -= FRESHNESS_DECAY_RATE;

                freshnessBar.style.width = `${currentPackage.freshness}%`;
                distanceVal.innerText = `ETA: ${Math.max(0, Math.floor(currentPackage.distance / 10))}m`;

                if (currentPackage.freshness <= 0) {
                    currentPackage.freshness = 0;
                    gameOver("Package Spoiled!");
                }

                if (currentPackage.distance <= 0) {
                    const bonus = Math.floor(currentPackage.freshness * 10);
                    score += 500 + bonus;
                    totalDeliveries++;
                    scoreVal.innerText = score;
                    createExplosion(player.x, player.y, 'var(--neon-yellow)');
                    spawnPackage();
                }
            }

            if (Math.random() < 0.02 + (totalDeliveries * 0.005)) spawnObstacle();

            obstacles.forEach((obs, index) => {
                obs.y += speed - obs.speed;
                if (Math.abs(player.x - obs.x) < (player.width / 2 + obs.width / 2) &&
                    Math.abs(player.y - obs.y) < (player.height / 2 + obs.height / 2)) {
                    gameOver("Collision Detected!");
                }
                if (obs.y > canvas.height + 100) obstacles.splice(index, 1);
            });

            buildings.forEach((b, index) => {
                b.y += speed;
                if (b.y > canvas.height + 200) {
                    buildings.splice(index, 1);
                    spawnBuilding(-200);
                }
            });

            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                if (p.life <= 0) particles.splice(index, 1);
            });

            score += Math.floor(speed / 5);
            scoreVal.innerText = score;
        }

        function gameOver(reason) {
            gameActive = false;
            createExplosion(player.x, player.y, 'var(--neon-pink)');

            document.getElementById('main-title').innerText = "TRANSMISSION LOST";
            document.getElementById('sub-title').innerText = reason;
            document.getElementById('final-stats').style.display = 'block';
            document.getElementById('final-score').innerText = `Final Score: ${score}`;
            document.getElementById('final-deliveries').innerText = `Deliveries Completed: ${totalDeliveries}`;
            document.getElementById('start-btn').innerText = "Reconnect";
            screenOverlay.style.display = 'flex';
        }

        function draw() {
            ctx.fillStyle = '#0a0a12';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const roadLeft = canvas.width / 2 - ROAD_WIDTH / 2;
            ctx.fillStyle = '#11111b';
            ctx.fillRect(roadLeft, 0, ROAD_WIDTH, canvas.height);

            // Road Lines
            ctx.strokeStyle = 'rgba(0, 242, 255, 0.2)';
            ctx.setLineDash([40, 40]);
            ctx.lineDashOffset = -worldY;
            for (let i = 1; i < 4; i++) {
                ctx.beginPath();
                ctx.moveTo(roadLeft + i * LANE_WIDTH, 0);
                ctx.lineTo(roadLeft + i * LANE_WIDTH, canvas.height);
                ctx.stroke();
            }
            ctx.setLineDash([]);

            // Road Borders
            ctx.strokeStyle = 'var(--neon-blue)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(roadLeft, 0);
            ctx.lineTo(roadLeft, canvas.height);
            ctx.moveTo(roadLeft + ROAD_WIDTH, 0);
            ctx.lineTo(roadLeft + ROAD_WIDTH, canvas.height);
            ctx.stroke();

            // Draw Buildings with animation
            buildings.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, b.width, b.height);

                // Neon windows - added flickering animation
                const flicker = Math.sin(frameCount * 0.05 + b.flicker * 10) > -0.8;
                ctx.fillStyle = b.neonColor;
                ctx.globalAlpha = flicker ? 0.3 : 0.05;
                for (let row = 0; row < 5; row++) {
                    for (let col = 0; col < 3; col++) {
                        if ((b.flicker + row + col) % 3 === 0) {
                            ctx.fillRect(b.x + 15 + col * 25, b.y + 20 + row * 40, 15, 20);
                        }
                    }
                }
                ctx.globalAlpha = 1.0;
            });

            obstacles.forEach(obs => {
                ctx.save();
                ctx.translate(obs.x, obs.y);
                ctx.fillStyle = obs.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = obs.color;
                ctx.fillRect(-obs.width / 2, -obs.height / 2, obs.width, obs.height);
                ctx.fillStyle = '#f00';
                ctx.fillRect(-obs.width / 2 + 5, obs.height / 2 - 5, 8, 3);
                ctx.fillRect(obs.width / 2 - 13, obs.height / 2 - 5, 8, 3);
                ctx.restore();
            });

            // Draw Player (Hover Bike) with Bobbing Animation
            ctx.save();
            // player.y is now constant at bottom, we add hoverOffset for animation
            ctx.translate(player.x, player.y + player.hoverOffset);
            ctx.rotate(player.rotation);

            ctx.shadowBlur = 15;
            ctx.shadowColor = player.color;

            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.moveTo(0, -25);
            ctx.lineTo(12, 10);
            ctx.lineTo(8, 25);
            ctx.lineTo(-8, 25);
            ctx.lineTo(-12, 10);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = 'var(--neon-blue)';
            const enginePulse = 10 + Math.random() * 10 * (speed / PLAYER_MAX_SPEED);
            ctx.fillRect(-6, 25, 12, enginePulse);

            ctx.fillStyle = '#aaa';
            ctx.fillRect(-18, 5, 8, 15);
            ctx.fillRect(10, 5, 8, 15);
            ctx.restore();

            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1.0;

            ctx.fillStyle = 'rgba(18, 16, 16, 0.1)';
            for (let i = 0; i < canvas.height; i += 4) {
                ctx.fillRect(0, i, canvas.width, 1);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        init();
    </script>
</body>

</html>
